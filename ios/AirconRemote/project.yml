# xcodegen generate でこの定義から AirconRemote.xcodeproj を生成する（生成物はコミットしない）
name: AirconRemote
options:
  bundleIdPrefix: local.aircon
  # Siri / App Shortcuts のフレーズを日本語として扱わせる（ADR-023）
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  AirconRemote:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    dependencies:
      - target: AirconWidgets
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: おうちリモコン
        # Keychain 共有グループ名を実行時に組み立てるため（Shared/Keychain.swift）
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Sources/AirconRemote.entitlements
      properties:
        # アプリとウィジェット拡張で APP_TOKEN・URL・前回の設定を共有する（ADR-023）
        keychain-access-groups:
          - $(AppIdentifierPrefix)local.aircon.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.aircon.AirconRemote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  # ウィジェット・コントロール（ADR-023）。コントロールのため iOS 18 以上
  AirconWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: おうちリモコン
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/AirconWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)local.aircon.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.aircon.AirconRemote.Widgets
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  AirconRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: AirconRemote
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AirconRemote:
    build:
      targets:
        AirconRemote: all
        AirconRemoteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AirconRemoteTests
